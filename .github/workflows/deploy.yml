name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: production
        type: choice
        options: [production, preview]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait: don't block the runner on the remote build; check progress on expo.dev.
      # Submission isn't wired up yet — eas.json's submit.production has no store
      # credentials configured, so `eas submit` would only work interactively.
      - name: EAS build
        run: eas build --platform all --profile ${{ github.event.inputs.profile || 'production' }} --non-interactive --no-wait
